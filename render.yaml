# Render Blueprint: deploys the AgriOpportunity API and a PostgreSQL database.
# Render dashboard -> New -> Blueprint -> pick this repo. Render reads this file.
services:
  - type: web
    name: agriopportunity-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agriopportunity-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: SEED_ON_START
        value: "true"

databases:
  - name: agriopportunity-db
    plan: free
    databaseName: agriopportunity
    user: agriopportunity
